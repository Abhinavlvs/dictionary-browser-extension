name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with the Chrome zip, Firefox xpi and checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check tag matches manifest and package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          M="$(node -p "require('./manifest.json').version")"
          P="$(node -p "require('./package.json').version")"
          echo "tag=$TAG manifest=$M package=$P"
          [ "$TAG" = "$M" ] && [ "$TAG" = "$P" ] || { echo "Version mismatch"; exit 1; }

      - run: npm test
      - run: npm run build

      - name: Checksums and release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum *.zip *.xpi > SHA256SUMS.txt)
          awk -v v="$VERSION" '$0 ~ ("^## \\[" v "\\]") {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $VERSION" > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.xpi dist/SHA256SUMS.txt \
            --title "Dictionary Lookup ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
